# Скопируй этот файл в config.yaml и поменяй под себя.
# config.yaml в git не попадает.

user_name: Игорь

ollama:
  url: http://127.0.0.1:11434
  model: qwen3:8b          # RU/DE/EN/HE, умеет вызывать инструменты, влезает в 8 ГБ видеопамяти
  timeout: 120
  think: false             # без «размышлений» — быстрее отвечает
  options:
    num_predict: 700       # максимум длины ответа — защита от зацикливания
    repeat_penalty: 1.15   # штраф за повторы
    # num_gpu: 99          # видеокарта: все слои модели на GPU (проверка: `ollama ps` → 100% GPU)
    # num_ctx: 4096        # длина памяти разговора; больше — больше видеопамяти

claude_code:
  enabled: true
  command: claude
  # plan — Claude только читает и отвечает, ничего не меняет на диске.
  # Не ставь bypassPermissions, если не понимаешь последствий.
  permission_mode: plan
  timeout: 300
  workdir: workspace        # папка внутри проекта, в которой работает Claude

# Белый список. Капри запускает ТОЛЬКО то, что здесь есть.
# Слева — как ты называешь программу (синонимы через |), справа — команда или ссылка.
apps:
  "браузер|browser": https://www.google.com
  "блокнот|notepad|editor": notepad
  "калькулятор|calculator|rechner": calc
  "проводник|explorer": explorer
  "терминал|terminal": wt
  "steam|стим": steam://open/main
  # vscode: code

search_url: https://www.google.com/search?q={query}

# Спрашивать подтверждение перед запуском программ и сайтов
confirm_actions: true

notes_file: data/notes.md   # относительные пути считаются от папки проекта

ui:
  style: hud                # hud — панель «Personal Link», classic — простой чат

avatar:
  size: 150
  wander: true                # гулять по экрану и сидеть на окнах
  # Как Капри выглядит на рабочем столе:
  #   auto   — есть прозрачные спрайты в assets/custom/desktop → они; иначе голограмма с клипами из hud/
  #   sprite — только спрайты, holo — всегда голограмма, star — неоновая звезда
  desktop_mode: auto
  # Своя внешность. Пусто = всё из папки assets/custom/ (в git не попадает).
  # Анимация выбирается по слову в имени файла: idle, walk, sit, think, talk, listen, teleport.
  # Например: idle.gif, walk.gif, sit.gif, talk.gif. Файлы без этих слов — варианты idle.
  custom_image: ""
  fps: 12

voice:
  enabled: true
  hotkey: Ctrl+Space          # нажал — говоришь, нажал ещё раз — Капри распознаёт
  whisper_model: small        # tiny | base | small | medium. На ноуте без видеокарты: base или small
  languages: [ru, de, en, he] # из каких языков выбирать при распознавании
  preferred_language: ru      # фора при распознавании коротких фраз

  # Озвучка: edge — живые нейроголоса Microsoft (нужен интернет, текст ответа уходит в Microsoft),
  #          piper — полностью офлайн, но звучит «роботнее». Без интернета edge сам переключится на piper.
  tts_engine: edge
  edge_voices:                # все голоса: .venv\Scripts\edge-tts --list-voices
    ru: ru-RU-SvetlanaNeural  # или ru-RU-DariyaNeural
    de: de-DE-AmalaNeural     # или de-DE-KatjaNeural
    en: en-US-AvaNeural       # или en-US-JennyNeural
    he: he-IL-HilaNeural
  edge_rate: "+8%"            # скорость речи
  edge_pitch: "+6Hz"          # высота голоса
  speak: true                 # озвучивать ответы
  speak_only_voice: true      # озвучивать, только если вопрос был голосом
  max_speech_chars: 600       # длинные ответы читаются только до этого места
  models_dir: data/models     # сюда скачаются модели (~500 МБ)
  piper_voices:               # голоса Piper: https://rhasspy.github.io/piper-samples/
    ru: ru_RU-irina-medium
    de: de_DE-kerstin-low
    en: en_US-amy-medium
    # для иврита Капри использует голос Windows (если установлен языковой пакет иврита)
